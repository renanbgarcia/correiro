name: correiro

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: correiro
      MYSQL_USER: correiro
      MYSQL_PASSWORD: correiro_local
      MYSQL_ROOT_PASSWORD: correiro_root_local
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - correiro_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: correiro
      MYSQL_USER: correiro
      MYSQL_PASSWORD: correiro_local
      SESSION_SECRET: desenvolvimento-local-sessao-corriero-2026-troque
      TOKEN_ENCRYPTION_KEY: desenvolvimento-local-token-correiro-2026-troque
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-http://localhost:3000/api/channels/meta/callback}
      META_DEMO_MODE: "${META_DEMO_MODE:-true}"
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_BASE_URL: ${COMPOSIO_BASE_URL:-}
      COMPOSIO_CALLBACK_URL: ${COMPOSIO_CALLBACK_URL:-http://localhost:3000/api/channels/composio/callback}
      COMPOSIO_FACEBOOK_VERSION: ${COMPOSIO_FACEBOOK_VERSION:-20260721_00}
      COMPOSIO_INSTAGRAM_VERSION: ${COMPOSIO_INSTAGRAM_VERSION:-20260721_00}
      WORKER_INLINE: "true"
      STORAGE_DIR: ./storage
    command:
      - sh
      - -c
      - node src/seed.js && node src/server.js
    ports:
      - "3000:3000"
    volumes:
      - correiro_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  correiro_mysql_data:
  correiro_storage:
